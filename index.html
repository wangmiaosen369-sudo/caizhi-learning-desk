<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>财智学习台</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#17202a;background:#eef1f5}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid #dbe2ea;padding:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px}.logo{width:38px;height:38px;border-radius:8px;background:#0f172a;color:#fff;display:grid;place-items:center}.nav{margin-top:22px;display:grid;gap:8px}.nav button,.btn{border:1px solid #dbe2ea;background:#fff;border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;color:#334155}.nav button.active,.btn.primary{background:#0f766e;color:white;border-color:#0f766e}.main{padding:28px;max-width:1280px}.grid{display:grid;gap:16px}.cols2{grid-template-columns:1.2fr .8fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:18px;box-shadow:0 14px 40px rgba(15,23,42,.06)}h1,h2,h3{margin:0}p{line-height:1.7}.muted{color:#64748b;font-size:14px}.chip{display:inline-block;border:1px solid #dbe2ea;background:#f8fafc;border-radius:7px;padding:4px 8px;margin:4px 4px 0 0;font-size:12px;color:#475569}.hero{background:#0f172a;color:#fff}.hero p{color:#cbd5e1}.metric{background:#f8fafc;border-radius:8px;padding:12px}.metric b{display:block;font-size:18px;margin-top:4px}.risk{background:#fffbeb;border-color:#fde68a;color:#92400e}.hide{display:none}.input,textarea{width:100%;border:1px solid #dbe2ea;border-radius:8px;padding:10px;font:inherit}textarea{min-height:90px}.chatBtn{position:fixed;right:18px;bottom:18px;z-index:10}.chat{position:fixed;right:18px;bottom:70px;width:min(420px,calc(100vw - 36px));max-height:70vh;overflow:auto;z-index:10}.msg{padding:9px 11px;border-radius:10px;margin:8px 0;background:#f1f5f9}.msg.user{background:#0f766e;color:white;margin-left:50px}.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#0f766e}.goldline{height:180px;background:linear-gradient(180deg,#fff7ed,#fff);border:1px solid #fed7aa;border-radius:10px;position:relative;overflow:hidden}.goldline svg{width:100%;height:100%}@media(max-width:900px){.app{display:block}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.main{padding:16px}.cols2,.cols3,.cols4{grid-template-columns:1fr}.chat{left:12px;right:12px;width:auto}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><div class="logo">财</div><div>财智学习台<div class="muted">财经热点 + 股票分析教学</div></div></div><nav class="nav" id="nav"></nav><div class="card risk" style="margin-top:18px;font-size:13px">本工具仅用于财经知识学习和信息整理，不构成任何投资建议。股票市场有风险，投资需谨慎。</div></aside>
  <main class="main" id="main"></main>
</div>
<button class="btn primary chatBtn" onclick="toggleChat()">科普提问</button>
<section class="card chat hide" id="chat"><h3>财经科普问答</h3><div id="msgs"><div class="msg">你好，可以问我黄金、股票估值、K线、财报指标等问题。我会用学习框架解释。</div></div><div style="display:flex;gap:8px;margin-top:10px"><input id="q" class="input" placeholder="输入问题，例如黄金股为什么会涨" onkeydown="if(event.key==='Enter')ask()"><button class="btn primary" onclick="ask()">发送</button></div></section>
<script>
const pages=[['home','首页'],['news','每日热点'],['learn','学习中心'],['stock','股票解析'],['gold','黄金研究'],['kline','K线训练'],['watch','观察笔记'],['glossary','术语词典']];
const news=['通胀数据温和回落，市场关注利率路径','AI算力板块活跃，国产芯片链受关注','新能源汽车价格竞争延续，利润率承压','高股息公司披露分红预案，红利资产受关注','国际油价震荡，影响通胀和行业成本'];
const lessons=['股票是什么','指数是什么','PE、PB、PS是什么','宏观经济如何影响股市','如何看财报','ROE、现金流、毛利率怎么看','K线图基础','成交量和均线','支撑位和压力位'];
const stocks={贵州茅台:['600519','A股','白酒','品牌壁垒强、现金流好，重点看批价、库存、分红和估值。'],英伟达:['NVDA','美股','半导体','AI算力核心公司，重点看数据中心收入、毛利率和高估值消化。'],腾讯控股:['0700','港股','互联网','社交生态和现金流较强，重点看游戏、广告、回购和监管。'],苹果:['AAPL','美股','消费电子','硬件生态和服务业务驱动，重点看换机周期、服务收入和回购。'],比亚迪:['002594','A股','新能源汽车','垂直整合能力强，重点看销量、单车利润、海外增长。'],山东黄金:['600547','A股','黄金矿业','业绩对金价和成本敏感，重点看自产金产量、AISC成本和套保比例。'],中金黄金:['600489','A股','黄金矿业','央企黄金平台，重点看资源整合、产量增长和成本控制。'],紫金矿业:['601899','A股','有色金属','铜金双主线，重点看金价、铜价、海外项目和单位成本。']};
const goldFactors=['金价上涨带来的利润弹性','实际利率下行','央行购金和避险需求','产量增长或资源扩张','估值修复与资金偏好'];
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button onclick="go('${p[0]}')" id="n-${p[0]}">${p[1]}</button>`).join('')}function active(id){pages.forEach(p=>document.getElementById('n-'+p[0])?.classList.toggle('active',p[0]===id))}
function go(id){active(id);let m=document.getElementById('main');if(id==='home')m.innerHTML=`<div class="grid cols2"><section class="card hero"><p>中文财经学习型工作台</p><h1>每天看懂财经热点，建立股票分析框架</h1><p>从新闻、小白解释、财报指标、估值、K线、黄金研究到长期观察笔记，帮助金融小白系统学习。</p><button class="btn primary" onclick="go('stock')">开始解析股票</button></section><section class="card"><h3>市场情绪</h3><div class="metric">热点强度<b>中高</b><span class="muted">AI、红利、黄金、能源事件驱动较多</span></div><div class="metric">学习重点<b>现金流 + 估值</b><span class="muted">今天适合练习利润是否变成钱</span></div></section></div><div class="grid cols3" style="margin-top:16px"><section class="card" onclick="go('learn')"><h3>学习路径入口</h3><p>基础、市场、公司、K线四阶段。</p></section><section class="card" onclick="go('gold')"><h3>黄金研究入口</h3><p>学习金价、利率、美元与黄金股传导。</p></section><section class="card" onclick="go('watch')"><h3>自选股观察</h3><p>记录关注理由、风险和财报观察。</p></section></div>`;
if(id==='news')m.innerHTML=`<h2>每日财经热点</h2><div class="grid cols3">${news.map((n,i)=>`<section class="card"><span class="chip">热点${i+1}</span><h3>${n}</h3><p>小白解释：把新闻拆成宏观、行业、公司和情绪影响，避免只看标题。</p><p><b>为什么重要：</b>会影响资金偏好、行业估值和公司盈利预期。</p></section>`).join('')}</div>`;
if(id==='learn')m.innerHTML=`<h2>金融知识库</h2><p class="muted">每节课包含目标、概念拆解、误区、复盘清单和测验。</p><div class="bar"><i style="width:42%"></i></div><div class="grid cols3" style="margin-top:16px">${lessons.map((l,i)=>`<section class="card"><span class="chip">${i<3?'入门':i<6?'进阶':'实战'} · ${i<3?'8':'12'}分钟</span><h3>${l}</h3><p>目标：能用自己的话讲清概念，知道数据来源、适用场景和局限性。</p><p><b>常见误区：</b>只看单一指标下结论，忽视行业差异。</p></section>`).join('')}</div>`;
if(id==='stock')m.innerHTML=`<h2>股票解析</h2><div class="card"><input id="stockInput" class="input" placeholder="输入股票名称，如 贵州茅台、英伟达、山东黄金"><button class="btn primary" onclick="analyze()" style="margin-top:8px">分析</button><div id="stockOut"></div></div>`;
if(id==='gold')m.innerHTML=`<h2>黄金走势与黄金股研究</h2><div class="grid cols2"><section class="card"><h3>黄金价格核心变量</h3><div class="goldline"><svg viewBox="0 0 500 180"><polyline points="20,135 80,120 140,92 200,70 260,85 320,55 380,40 460,58" fill="none" stroke="#d97706" stroke-width="5"/><text x="25" y="28" fill="#92400e">模拟金价趋势</text></svg></div><div class="grid cols4"><div class="metric">实际利率<b>反向观察</b></div><div class="metric">美元指数<b>常见反向</b></div><div class="metric">避险情绪<b>阶段驱动</b></div><div class="metric">央行购金<b>长期支撑</b></div></div></section><section class="card"><h3>黄金不是单一逻辑资产</h3><p>抗通胀、实际利率、美元、避险和央行购金共同影响黄金。黄金股还要额外看产量、成本、矿山安全、资本开支和估值。</p></section></div><section class="card" style="margin-top:16px"><h3>黄金股价格上涨的分析依据</h3><p class="muted">上涨依据不等于买入建议。</p><div class="grid cols3">${goldFactors.map(f=>`<div class="metric"><b>${f}</b><p>检查对应数据是否改善，并观察是否已经反映在估值中。</p></div>`).join('')}</div><div class="grid cols3"><div><h3>更有说服力</h3><p>金价上涨同时实际利率下行；公司产量提升且成本稳定。</p></div><div><h3>容易误判</h3><p>只因新闻多就判断会涨；忽略套保、成本和估值。</p></div><div><h3>跟踪清单</h3><p>金价、美元、实际利率、AISC成本、ETF持仓、成交量。</p></div></div></section>`;
if(id==='kline')m.innerHTML=`<h2>K线训练营</h2><div class="grid cols3">${['长阳线','长阴线','十字星','锤子线','放量上涨','缩量回调','突破压力位','跌破支撑位'].map(x=>`<section class="card"><h3>${x}</h3><p>图形特征、可能含义、适用场景和误区都要一起看，不能单独作为买卖依据。</p></section>`).join('')}</div>`;
if(id==='watch')m.innerHTML=`<h2>自选股观察笔记</h2><section class="card"><input id="wname" class="input" placeholder="股票名称"><textarea id="wnote" placeholder="关注理由、风险、我的理解"></textarea><button class="btn primary" onclick="saveNote()">保存到本地</button><div id="notes"></div></section>`; if(id==='watch')showNotes();
if(id==='glossary')m.innerHTML=`<h2>财经术语词典</h2><div class="grid cols3">${['PE','PB','PS','ROE','EPS','股息率','自由现金流','毛利率','净利率','降息','美联储','ETF'].map(t=>`<section class="card"><h3>${t}</h3><p>${explain(t)}</p></section>`).join('')}</div>`;}
function analyze(){let q=document.getElementById('stockInput').value.trim();let s=stocks[q]||['MOCK','教学模板','待识别行业','暂未收录真实数据，以下用于练习基本面、估值、K线和长期观察框架。'];document.getElementById('stockOut').innerHTML=`<div class="grid cols3" style="margin-top:16px"><div class="metric">代码<b>${s[0]}</b></div><div class="metric">市场<b>${s[1]}</b></div><div class="metric">行业<b>${s[2]}</b></div></div><p>${s[3]}</p><h3>观察框架</h3><p>基本面：营收、利润、现金流、ROE；估值：PE/PB/PS和历史区间；技术面：趋势、成交量、支撑压力；风险：行业周期、竞争、政策和财务压力。</p>`}
function explain(t){return {PE:'市盈率，股价相对盈利的倍数，低PE不一定便宜。',PB:'市净率，常用于重资产行业。',PS:'市销率，适合观察收入阶段公司。',ROE:'股东资金赚钱效率，要拆解是否来自高负债。',ETF:'交易型开放式指数基金，可分散但仍有波动。'}[t]||'用于理解市场和公司，不应单独作为买卖依据。'}
function saveNote(){let arr=JSON.parse(localStorage.notes||'[]');arr.push({n:wname.value,t:wnote.value});localStorage.notes=JSON.stringify(arr);showNotes()}function showNotes(){let arr=JSON.parse(localStorage.notes||'[]');notes.innerHTML=arr.map(x=>`<div class="metric"><b>${x.n}</b><p>${x.t}</p></div>`).join('')}
function toggleChat(){chat.classList.toggle('hide')}function ask(){let q=document.getElementById('q').value.trim();if(!q)return;msgs.innerHTML+=`<div class="msg user">${q}</div><div class="msg">${answer(q)}</div>`;document.getElementById('q').value=''}function answer(q){if(q.includes('黄金'))return '黄金股要看四层：金价和实际利率、公司产量与成本、估值是否透支、资金情绪和成交量。上涨依据不等于买入建议。';if(q.includes('PE')||q.includes('估值'))return 'PE要和历史区间、同行、利润增速、现金流质量一起看。低PE不一定便宜，高PE也不一定不合理。';if(q.includes('K线'))return 'K线先看趋势，再看关键位置和成交量配合，不能单独作为买卖依据。';return '建议按宏观、行业、公司、估值、交易行为五层拆解问题，并写下不确定因素。'}nav();go('home');
</script>
</body>
</html>
